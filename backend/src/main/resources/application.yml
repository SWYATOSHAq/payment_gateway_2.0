spring:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  error:
    include-message: always

gateway:
  checkout:
    merchant-id: ${GATEWAY_MERCHANT_ID:0}
    key: ${GATEWAY_CHECKOUT_KEY:}
  cloudpayments:
    public-id: ${CLOUDPAYMENTS_PUBLIC_ID:}
    api-secret: ${CLOUDPAYMENTS_API_SECRET:}
  auth:
    jwt-secret: ${GATEWAY_JWT_SECRET:}
    admin-login: ${GATEWAY_ADMIN_LOGIN:}
    admin-password: ${GATEWAY_ADMIN_PASSWORD:}
